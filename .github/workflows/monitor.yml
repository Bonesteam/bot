name: SMC Bot - Notifications Only

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

# Явно дозволяємо запис у репозиторій - без цього git push у кінці
# workflow падає з помилкою прав доступу (exit code 128), навіть якщо
# в налаштуваннях репозиторію не увімкнено "Read and write permissions".
permissions:
  contents: write

concurrency:
  group: smc-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run one monitoring cycle (notifications only)
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          BINANCE_TESTNET: "true"
          SYMBOL: "BTC/USDT"
          TIMEFRAME: "1h"
          WATCHLIST: "BTC/USDT,ETH/USDT,SOL/USDT,BNB/USDT,XRP/USDT,ADA/USDT,DOGE/USDT,AVAX/USDT,LINK/USDT,LTC/USDT"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_once.py

      - name: Save updated state back to repo
        run: |
          git config user.name "smc-bot"
          git config user.email "smc-bot@users.noreply.github.com"
          git add notified_setups.json signals_log.json
          git diff --staged --quiet || git commit -m "Update bot state [skip ci]"
          git pull --no-rebase --quiet || true
          git push
